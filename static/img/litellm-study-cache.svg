<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="litellm-study-cache-title litellm-study-cache-desc">
<title id="litellm-study-cache-title">같은 조건의 모델 요청 결과를 다시 사용하기</title><desc id="litellm-study-cache-desc">TTL은 저장한 결과의 유효기간이다. 캐시 hit는 새 추론을 줄일 수 있다.</desc>
<defs><pattern id="litellm-study-cache-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5eaf0" stroke-width="1"/></pattern><marker id="litellm-study-cache-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#202b3b}.box{fill:#f8fafc;stroke:#c0cbd8;stroke-width:2}.blue{fill:#e7f2ff;stroke:#2380dc}.green{fill:#edf8f2;stroke:#2a8a6b}.muted{fill:#58677b}.strong{font-weight:750}.accent{fill:#126dc0;font-weight:750}.good{fill:#187958;font-weight:750}.arrow{stroke:#536b86;stroke-width:3.5;fill:none}</style>
<rect width="1200" height="700" fill="#f8fafc"/><rect width="1200" height="700" fill="url(#litellm-study-cache-grid)"/>
<text x="36" y="45" font-size="16" class="accent" text-anchor="start">06 / RESPONSE CACHE</text><text x="36" y="92" font-size="32" class="strong" text-anchor="start">같은 조건의 모델 요청 결과를 다시 사용하기</text><text x="36" y="132" font-size="21" class="muted" text-anchor="start">TTL은 저장한 결과의 유효기간이다. 캐시 hit는 새 추론을 줄일 수 있다.</text>
<rect x="36" y="172" width="1128" height="204" rx="12" class="box "/><text x="58" y="205" font-size="23" class="accent" text-anchor="start">첫 요청 · Cache miss</text><rect x="60" y="238" width="248" height="105" rx="12" class="box "/><rect x="74" y="253" width="44" height="44" rx="9" fill="white" stroke="#c0cbd8"/><image href="data:image/svg+xml;base64," x="81" y="260" width="30" height="30"/><text x="201.0" y="278" font-size="23" class="strong" text-anchor="middle">요약 요청</text><text x="184.0" y="317" font-size="19" class="muted" text-anchor="middle">동일한 입력·모델·조건</text><rect x="436" y="238" width="248" height="105" rx="12" class="box "/><rect x="450" y="253" width="44" height="44" rx="9" fill="white" stroke="#c0cbd8"/><image href="data:image/svg+xml;base64," x="457" y="260" width="30" height="30"/><text x="577.0" y="278" font-size="23" class="strong" text-anchor="middle">캐시 조회</text><text x="560.0" y="317" font-size="19" class="muted" text-anchor="middle">저장 결과 없음</text><rect x="808" y="238" width="332" height="105" rx="12" class="box "/><rect x="822" y="253" width="44" height="44" rx="9" fill="white" stroke="#c0cbd8"/><image href="data:image/svg+xml;base64," x="829" y="260" width="30" height="30"/><text x="991.0" y="278" font-size="23" class="strong" text-anchor="middle">실제 모델 호출</text><text x="974.0" y="317" font-size="19" class="muted" text-anchor="middle">결과를 캐시에 저장 후 반환</text><path d="M314 283H428" class="arrow" marker-end="url(#litellm-study-cache-ar)"/><path d="M690 283H800" class="arrow" marker-end="url(#litellm-study-cache-ar)"/><rect x="36" y="406" width="1128" height="204" rx="12" class="box "/><text x="58" y="439" font-size="23" class="good" text-anchor="start">같은 조건의 요청 · Cache hit</text><rect x="60" y="472" width="248" height="105" rx="12" class="box "/><rect x="74" y="487" width="44" height="44" rx="9" fill="white" stroke="#c0cbd8"/><image href="data:image/svg+xml;base64," x="81" y="494" width="30" height="30"/><text x="201.0" y="512" font-size="23" class="strong" text-anchor="middle">요약 요청</text><text x="184.0" y="551" font-size="19" class="muted" text-anchor="middle">동일한 입력·모델·조건</text><rect x="436" y="472" width="248" height="105" rx="12" class="box "/><rect x="450" y="487" width="44" height="44" rx="9" fill="white" stroke="#c0cbd8"/><image href="data:image/svg+xml;base64," x="457" y="494" width="30" height="30"/><text x="577.0" y="512" font-size="23" class="strong" text-anchor="middle">캐시 조회</text><text x="560.0" y="551" font-size="19" class="muted" text-anchor="middle">저장 결과 있음</text><rect x="808" y="472" width="332" height="105" rx="12" class="box green"/><rect x="822" y="487" width="44" height="44" rx="9" fill="white" stroke="#c0cbd8"/><image href="data:image/svg+xml;base64," x="829" y="494" width="30" height="30"/><text x="991.0" y="512" font-size="23" class="strong" text-anchor="middle">저장 결과 반환</text><text x="974.0" y="551" font-size="19" class="muted" text-anchor="middle">모델 재호출 없이 반환</text><path d="M314 517H428" class="arrow" marker-end="url(#litellm-study-cache-ar)"/><path d="M690 517H800" class="arrow" marker-end="url(#litellm-study-cache-ar)"/><text x="600" y="651" font-size="23" class="strong" text-anchor="middle">재사용 가능한 결과를 저장한다. 대화 기억이나 모델 학습과는 다른 기능이다.</text><text x="36" y="682" font-size="13" class="muted" text-anchor="start">made with stack-diagram · icons: devicon / Lucide · 설명용 도식</text></svg>