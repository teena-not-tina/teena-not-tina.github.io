<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="litellm-study-keys-models-title litellm-study-keys-models-desc">
<title id="litellm-study-keys-models-title">모델 이름과 Virtual Key는 서로 다른 분류 기준이다</title><desc id="litellm-study-keys-models-desc">모델별 집계와 키별 집계는 같은 요청 기록을 다른 기준으로 묶는다.</desc>
<defs><pattern id="litellm-study-keys-models-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5eaf0" stroke-width="1"/></pattern><marker id="litellm-study-keys-models-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#202b3b}.box{fill:#f8fafc;stroke:#c0cbd8;stroke-width:2}.blue{fill:#e7f2ff;stroke:#2380dc}.green{fill:#edf8f2;stroke:#2a8a6b}.muted{fill:#58677b}.strong{font-weight:750}.accent{fill:#126dc0;font-weight:750}.good{fill:#187958;font-weight:750}.arrow{stroke:#536b86;stroke-width:3.5;fill:none}</style>
<rect width="1200" height="700" fill="#f8fafc"/><rect width="1200" height="700" fill="url(#litellm-study-keys-models-grid)"/>
<text x="36" y="45" font-size="16" class="accent" text-anchor="start">03 / TWO SEPARATE AXES</text><text x="36" y="92" font-size="32" class="strong" text-anchor="start">모델 이름과 Virtual Key는 서로 다른 분류 기준이다</text><text x="36" y="132" font-size="21" class="muted" text-anchor="start">모델별 집계와 키별 집계는 같은 요청 기록을 다른 기준으로 묶는다.</text>
<rect x="36" y="171" width="546" height="112" rx="12" class="box blue"/><rect x="54" y="196" width="44" height="44" rx="9" fill="white" stroke="#c0cbd8"/><image href="data:image/svg+xml;base64," x="61" y="203" width="30" height="30"/><text x="116" y="213" font-size="25" class="accent" text-anchor="start">모델: 무엇을 호출했나</text><text x="116" y="252" font-size="20" class="muted" text-anchor="start">예: model-A / model-B</text><rect x="618" y="171" width="546" height="112" rx="12" class="box green"/><rect x="636" y="196" width="44" height="44" rx="9" fill="white" stroke="#c0cbd8"/><image href="data:image/svg+xml;base64," x="643" y="203" width="30" height="30"/><text x="698" y="213" font-size="24" class="good" text-anchor="start">키: 어떤 자격 증명으로 호출했나</text><text x="698" y="252" font-size="20" class="muted" text-anchor="start">예: key-marketing / key-support</text><rect x="36" y="311" width="1128" height="225" rx="12" class="box "/><text x="66" y="350" font-size="21" class="strong" text-anchor="start">모델 요청 횟수</text><text x="465" y="350" font-size="21" class="strong" text-anchor="start">model-A</text><text x="752" y="350" font-size="21" class="strong" text-anchor="start">model-B</text><text x="1054" y="350" font-size="21" class="strong" text-anchor="start">키별 합계</text><text x="66" y="397" font-size="22" class="" text-anchor="start">key-marketing</text><text x="540" y="397" font-size="24" class="" text-anchor="middle">4</text><text x="830" y="397" font-size="24" class="" text-anchor="middle">1</text><text x="1100" y="397" font-size="24" class="" text-anchor="middle">5</text><text x="66" y="448" font-size="22" class="" text-anchor="start">key-support</text><text x="540" y="448" font-size="24" class="" text-anchor="middle">2</text><text x="830" y="448" font-size="24" class="" text-anchor="middle">8</text><text x="1100" y="448" font-size="24" class="" text-anchor="middle">10</text><text x="66" y="507" font-size="22" class="strong" text-anchor="start">모델별 합계</text><text x="540" y="507" font-size="24" class="accent" text-anchor="middle">6</text><text x="830" y="507" font-size="24" class="accent" text-anchor="middle">9</text><text x="1100" y="507" font-size="24" class="accent" text-anchor="middle">15</text><path d="M55 365H1145M55 466H1145" fill="none" stroke="#c0cbd8" stroke-width="1.5"/><text x="600" y="580" font-size="24" class="strong" text-anchor="middle">같은 키로 여러 모델을, 같은 모델을 여러 키로 사용할 수 있다.</text><text x="600" y="621" font-size="20" class="muted" text-anchor="middle">표의 키·모델명과 요청 횟수는 이해를 위한 가상 예시다.</text><text x="36" y="682" font-size="13" class="muted" text-anchor="start">made with stack-diagram · icons: devicon / Lucide · 설명용 도식</text></svg>