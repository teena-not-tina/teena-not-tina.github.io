<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="litellm-study-release-controls-title litellm-study-release-controls-desc">
<title id="litellm-study-release-controls-title">버전·의존성·파일·이미지·업데이트 시점을 따로 관리하기</title><desc id="litellm-study-release-controls-desc">한 가지 설정으로 모든 공급망 위험이 사라지지는 않는다.</desc>
<defs><pattern id="litellm-study-release-controls-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5eaf0" stroke-width="1"/></pattern><marker id="litellm-study-release-controls-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#202b3b}.box{fill:#f8fafc;stroke:#c0cbd8;stroke-width:2}.blue{fill:#e7f2ff;stroke:#2380dc}.green{fill:#edf8f2;stroke:#2a8a6b}.muted{fill:#58677b}.strong{font-weight:750}.accent{fill:#126dc0;font-weight:750}.good{fill:#187958;font-weight:750}.arrow{stroke:#536b86;stroke-width:3.5;fill:none}</style>
<rect width="1200" height="700" fill="#f8fafc"/><rect width="1200" height="700" fill="url(#litellm-study-release-controls-grid)"/>
<text x="36" y="45" font-size="16" class="accent" text-anchor="start">08 / DIFFERENT CONTROLS</text><text x="36" y="92" font-size="32" class="strong" text-anchor="start">버전·의존성·파일·이미지·업데이트 시점을 따로 관리하기</text><text x="36" y="132" font-size="21" class="muted" text-anchor="start">한 가지 설정으로 모든 공급망 위험이 사라지지는 않는다.</text>
<rect x="36" y="168" width="1128" height="82" rx="12" class="box blue"/><text x="58" y="217" font-size="23" class="strong" text-anchor="start">버전 고정</text><text x="280" y="217" font-size="22" class="" text-anchor="start">특정 패키지 버전 선택</text><text x="690" y="217" font-size="21" class="muted" text-anchor="start">그 버전의 안전성을 보장하지 않는다</text><rect x="36" y="262" width="1128" height="82" rx="12" class="box "/><text x="58" y="311" font-size="23" class="strong" text-anchor="start">Lockfile</text><text x="280" y="311" font-size="22" class="" text-anchor="start">의존성 조합 재현</text><text x="690" y="311" font-size="21" class="muted" text-anchor="start">실제 설치 경로가 lockfile을 따라야 한다</text><rect x="36" y="356" width="1128" height="82" rx="12" class="box blue"/><text x="58" y="405" font-size="23" class="strong" text-anchor="start">파일 해시</text><text x="280" y="405" font-size="22" class="" text-anchor="start">승인한 파일과 동일한지 확인</text><text x="690" y="405" font-size="21" class="muted" text-anchor="start">최초 승인한 파일의 신뢰도 별도 판단</text><rect x="36" y="450" width="1128" height="82" rx="12" class="box "/><text x="58" y="499" font-size="23" class="strong" text-anchor="start">이미지 digest</text><text x="280" y="499" font-size="22" class="" text-anchor="start">특정 이미지 내용 지정</text><text x="690" y="499" font-size="21" class="muted" text-anchor="start">오염된 이미지를 지정하면 계속 재사용</text><rect x="36" y="544" width="1128" height="82" rx="12" class="box blue"/><text x="58" y="593" font-size="23" class="strong" text-anchor="start">Cooldown</text><text x="280" y="593" font-size="22" class="" text-anchor="start">너무 새로운 릴리스 선택 지연</text><text x="690" y="593" font-size="21" class="muted" text-anchor="start">대기 기간이 악성 여부를 증명하지 않는다</text><text x="600" y="658" font-size="23" class="strong" text-anchor="middle">무엇을 선택했는지 재현하는 것과 안전성을 판단하는 것은 다른 일이다.</text><text x="36" y="682" font-size="13" class="muted" text-anchor="start">made with stack-diagram · icons: devicon / Lucide · 설명용 도식</text></svg>