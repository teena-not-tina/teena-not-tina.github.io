<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="litellm-study-key-flow-title litellm-study-key-flow-desc">
<title id="litellm-study-key-flow-title">키를 발급하는 단계와 키로 접근하는 단계를 구분하기</title><desc id="litellm-study-key-flow-desc">가상 조직의 일반적인 키 관리 예시다. 실제 발급 절차는 서비스마다 다를 수 있다.</desc>
<defs><pattern id="litellm-study-key-flow-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5eaf0" stroke-width="1"/></pattern><marker id="litellm-study-key-flow-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#202b3b}.box{fill:#f8fafc;stroke:#c0cbd8;stroke-width:2}.blue{fill:#e7f2ff;stroke:#2380dc}.green{fill:#edf8f2;stroke:#2a8a6b}.muted{fill:#58677b}.strong{font-weight:750}.accent{fill:#126dc0;font-weight:750}.good{fill:#187958;font-weight:750}.arrow{stroke:#536b86;stroke-width:3.5;fill:none}</style>
<rect width="1200" height="700" fill="#f8fafc"/><rect width="1200" height="700" fill="url(#litellm-study-key-flow-grid)"/>
<text x="36" y="45" font-size="16" class="accent" text-anchor="start">04 / KEY LIFECYCLE</text><text x="36" y="92" font-size="32" class="strong" text-anchor="start">키를 발급하는 단계와 키로 접근하는 단계를 구분하기</text><text x="36" y="132" font-size="21" class="muted" text-anchor="start">가상 조직의 일반적인 키 관리 예시다. 실제 발급 절차는 서비스마다 다를 수 있다.</text>
<rect x="36" y="175" width="1128" height="198" rx="12" class="box "/><text x="58" y="210" font-size="23" class="strong" text-anchor="start">발급 시: 관리자가 부서의 이용 목적과 정책을 확인</text><rect x="60" y="240" width="312" height="105" rx="12" class="box "/><text x="216" y="279" font-size="23" class="strong" text-anchor="middle">부서의 이용 요청</text><text x="216" y="321" font-size="21" class="muted" text-anchor="middle">목적과 모델 요구 전달</text><rect x="444" y="240" width="312" height="105" rx="12" class="box blue"/><text x="600" y="279" font-size="23" class="strong" text-anchor="middle">키 발급 관리자</text><text x="600" y="321" font-size="21" class="muted" text-anchor="middle">발급 권한과 정책 확인</text><rect x="828" y="240" width="312" height="105" rx="12" class="box "/><text x="984" y="279" font-size="23" class="strong" text-anchor="middle">LiteLLM 키 관리</text><text x="984" y="321" font-size="21" class="muted" text-anchor="middle">새 Virtual Key 발급</text><path d="M378 290H436" class="arrow" marker-end="url(#litellm-study-key-flow-ar)"/><path d="M762 290H820" class="arrow" marker-end="url(#litellm-study-key-flow-ar)"/><rect x="36" y="410" width="1128" height="198" rx="12" class="box "/><text x="58" y="445" font-size="23" class="strong" text-anchor="start">사용 시: 부서의 앱이 발급받은 키로 모델 호출</text><rect x="60" y="475" width="312" height="105" rx="12" class="box "/><text x="216" y="514" font-size="23" class="strong" text-anchor="middle">부서의 AI 앱</text><text x="216" y="556" font-size="21" class="muted" text-anchor="middle">발급받은 키 제시</text><rect x="444" y="475" width="312" height="105" rx="12" class="box blue"/><text x="600" y="514" font-size="23" class="strong" text-anchor="middle">LiteLLM Proxy</text><text x="600" y="556" font-size="21" class="muted" text-anchor="middle">키와 호출 정책 확인</text><rect x="828" y="475" width="312" height="105" rx="12" class="box "/><text x="984" y="514" font-size="23" class="strong" text-anchor="middle">허용된 모델 호출</text><text x="984" y="556" font-size="21" class="muted" text-anchor="middle">제공자 API에서 실행</text><path d="M378 525H436" class="arrow" marker-end="url(#litellm-study-key-flow-ar)"/><path d="M762 525H820" class="arrow" marker-end="url(#litellm-study-key-flow-ar)"/><text x="600" y="651" font-size="23" class="strong" text-anchor="middle">부서용 Virtual Key와 제공자의 원본 API 키는 역할이 다르다.</text><text x="36" y="682" font-size="13" class="muted" text-anchor="start">made with stack-diagram · icons: devicon / Lucide · 설명용 도식</text></svg>