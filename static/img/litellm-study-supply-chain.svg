<text x="36" y="45" font-size="16" class="accent" text-anchor="start">07 / SUPPLY CHAIN</text><text x="36" y="92" font-size="32" class="strong" text-anchor="start">공식 경로로 받은 배포물도 검증 대상이다</text><text x="36" y="132" font-size="21" class="muted" text-anchor="start">공급망 사고는 모델 API 호출 이전의 빌드·설치·실행 단계에도 영향을 준다.</text>
<rect x="36" y="175" width="1128" height="198" rx="12" class="box "/><text x="58" y="210" font-size="23" class="strong" text-anchor="start">배포 측: 릴리스 권한과 빌드 경로의 신뢰가 깨지는 경우</text><rect x="60" y="240" width="312" height="105" rx="12" class="box "/><text x="216" y="279" font-size="23" class="strong" text-anchor="middle">자격 증명 탈취</text><text x="216" y="321" font-size="20" class="muted" text-anchor="middle">릴리스 권한 확보</text><rect x="444" y="240" width="312" height="105" rx="12" class="box blue"/><text x="600" y="279" font-size="23" class="strong" text-anchor="middle">배포 흐름 악용</text><text x="600" y="321" font-size="20" class="muted" text-anchor="middle">악성 배포물 생성</text><rect x="828" y="240" width="312" height="105" rx="12" class="box "/><text x="984" y="279" font-size="23" class="strong" text-anchor="middle">공식 배포 경로</text><text x="984" y="321" font-size="20" class="muted" text-anchor="middle">패키지 · 이미지 게시</text><path d="M378 290H436" class="arrow" marker-end="url(#litellm-study-supply-chain-ar)"/><path d="M762 290H820" class="arrow" marker-end="url(#litellm-study-supply-chain-ar)"/><rect x="36" y="410" width="1128" height="198" rx="12" class="box "/><text x="58" y="445" font-size="23" class="strong" text-anchor="start">설치 측: 오염된 배포물이 실행 환경으로 들어오는 경우</text><rect x="60" y="475" width="312" height="105" rx="12" class="box "/><text x="216" y="514" font-size="23" class="strong" text-anchor="middle">개발 · CI · 런타임</text><text x="216" y="556" font-size="20" class="muted" text-anchor="middle">패키지 또는 이미지 수신</text><rect x="444" y="475" width="312" height="105" rx="12" class="box blue"/><text x="600" y="514" font-size="23" class="strong" text-anchor="middle">설치된 코드 실행</text><text x="600" y="556" font-size="20" class="muted" text-anchor="middle">Python 시작 훅 등</text><rect x="828" y="475" width="312" height="105" rx="12" class="box "/><text x="984" y="514" font-size="23" class="strong" text-anchor="middle">접근 가능한 비밀정보</text><text x="984" y="556" font-size="20" class="muted" text-anchor="middle">실행 권한 범위에서 위험</text><path d="M378 525H436" class="arrow" marker-end="url(#litellm-study-supply-chain-ar)"/><path d="M762 525H820" class="arrow" marker-end="url(#litellm-study-supply-chain-ar)"/><text x="600" y="651" font-size="22" class="strong" text-anchor="middle">일반화한 공격 흐름이다. 사고별 진입점과 영향받은 배포물은 구분해서 확인한다.</text><text x="36" y="682" font-size="13" class="muted" text-anchor="start">made with stack-diagram · icons: devicon / Lucide · 설명용 도식</text></svg>