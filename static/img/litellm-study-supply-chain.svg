<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="litellm-study-supply-chain-title litellm-study-supply-chain-desc">
<title id="litellm-study-supply-chain-title">공식 경로로 받은 배포물도 검증 대상이다</title><desc id="litellm-study-supply-chain-desc">공급망 사고는 모델 API 호출 이전의 빌드·설치·실행 단계에도 영향을 준다.</desc>
