<text x="36" y="45" font-size="16" class="accent" text-anchor="start">02 / SDK &amp; PROXY</text><text x="36" y="92" font-size="32" class="strong" text-anchor="start">제공자별 요청 방식을 공통 인터페이스로 연결하기</text><text x="36" y="132" font-size="21" class="muted" text-anchor="start">SDK는 라이브러리이고, Proxy는 별도로 실행하는 서버다.</text>
