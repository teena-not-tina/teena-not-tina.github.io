<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="litellm-study-why-title litellm-study-why-desc">
<title id="litellm-study-why-title">여러 AI 기능에 필요한 공통 작업을 모으기</title><desc id="litellm-study-why-desc">가상 조직의 예시다. 특정 회사의 운영 구조를 재현하지 않는다.</desc>
<defs><pattern id="litellm-study-why-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5eaf0" stroke-width="1"/></pattern><marker id="litellm-study-why-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:system-ui,"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#202b3b}.box{fill:#f8fafc;stroke:#c0cbd8;stroke-width:2}.blue{fill:#e7f2ff;stroke:#2380dc}.green{fill:#edf8f2;stroke:#2a8a6b}.muted{fill:#58677b}.strong{font-weight:750}.accent{fill:#126dc0;font-weight:750}.good{fill:#187958;font-weight:750}.arrow{stroke:#536b86;stroke-width:3.5;fill:none}</style>
<rect width="1200" height="700" fill="#f8fafc"/><rect width="1200" height="700" fill="url(#litellm-study-why-grid)"/>
<text x="36" y="45" font-size="16" class="accent" text-anchor="start">01 / WHY A GATEWAY</text><text x="36" y="92" font-size="32" class="strong" text-anchor="start">여러 AI 기능에 필요한 공통 작업을 모으기</text><text x="36" y="132" font-size="21" class="muted" text-anchor="start">가상 조직의 예시다. 특정 회사의 운영 구조를 재현하지 않는다.</text>
<rect x="36" y="190" width="302" height="312" rx="12" class="box "/><text x="187.0" y="240" font-size="24" class="strong" text-anchor="middle">가상 조직의 AI 활용</text><text x="187.0" y="310" font-size="23" class="muted" text-anchor="middle">마케팅팀: 문구 작성</text><text x="187.0" y="366" font-size="23" class="muted" text-anchor="middle">고객지원팀: 답변 초안</text><text x="187.0" y="422" font-size="23" class="muted" text-anchor="middle">개발팀: 코드 검토</text><rect x="449" y="190" width="302" height="312" rx="12" class="box blue"/><text x="600.0" y="240" font-size="24" class="strong" text-anchor="middle">공통 모델 게이트웨이</text><text x="600.0" y="310" font-size="23" class="muted" text-anchor="middle">요청 형식 변환</text><text x="600.0" y="366" font-size="23" class="muted" text-anchor="middle">호출 정책 적용</text><text x="600.0" y="422" font-size="23" class="muted" text-anchor="middle">모델 사용량 기록</text><rect x="862" y="190" width="302" height="312" rx="12" class="box "/><text x="1013.0" y="240" font-size="24" class="strong" text-anchor="middle">모델 제공자 API</text><text x="1013.0" y="310" font-size="23" class="muted" text-anchor="middle">선택한 제공자</text><text x="1013.0" y="366" font-size="23" class="muted" text-anchor="middle">선택한 모델</text><text x="1013.0" y="422" font-size="23" class="muted" text-anchor="middle">실제 추론 실행</text><path d="M346 345H441" class="arrow" marker-end="url(#litellm-study-why-ar)"/><path d="M759 345H854" class="arrow" marker-end="url(#litellm-study-why-ar)"/><rect x="36" y="538" width="1128" height="94" rx="12" class="box green"/><text x="600" y="576" font-size="23" class="good" text-anchor="middle">앱의 책임: 사용자 권한 · 업무 실행 맥락 · 부서별 이용 기준 · 업무 지표</text><text x="600" y="612" font-size="21" class="muted" text-anchor="middle">게이트웨이에 공통 기능을 모아도 제품의 업무 규칙은 별도로 정의한다.</text><text x="36" y="682" font-size="13" class="muted" text-anchor="start">made with stack-diagram · icons: devicon / Lucide · 설명용 도식</text></svg>